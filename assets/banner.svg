<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Vso, InfinityNet. Small tools, built on Android.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1b1245"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="cl"><rect width="900" height="260" rx="20"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}
      .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      @keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
      .cur{animation:blink 1.1s steps(1) infinite}
    </style>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <ellipse cx="170" cy="60" rx="230" ry="150" fill="url(#g1)">
      <animate attributeName="cx" values="150;230;150" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="220" rx="260" ry="160" fill="url(#g2)">
      <animate attributeName="cx" values="780;690;780" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <text x="48" y="132" class="sans" font-size="96" font-weight="800" fill="url(#tx)">Vso</text>
    <text x="52" y="176" class="mono" font-size="19" fill="#e2e8f0">InfinityNet</text>
    <text x="52" y="206" class="mono" font-size="14.5" fill="#94a3b8">small tools · built on Android<tspan class="cur" fill="#22d3ee" dx="6">█</tspan></text>
    <rect x="500" y="38" width="360" height="184" rx="14" fill="#0b1124" fill-opacity="0.92" stroke="#2b3566" stroke-width="1.2"/>
    <circle cx="522" cy="58" r="5" fill="#fb7185"/>
    <circle cx="540" cy="58" r="5" fill="#fbbf24"/>
    <circle cx="558" cy="58" r="5" fill="#4ade80"/>
    <text x="520" y="96" class="mono" font-size="13.5" fill="#e2e8f0"><tspan fill="#22d3ee">$</tspan> rndkit name</text>
    <text x="520" y="116" class="mono" font-size="13.5" fill="#a78bfa">CyberForge</text>
    <text x="520" y="146" class="mono" font-size="13.5" fill="#e2e8f0"><tspan fill="#22d3ee">$</tspan> cidrkit info 10.0.0.0/22</text>
    <text x="520" y="166" class="mono" font-size="13.5" fill="#a78bfa">usable  1022</text>
    <text x="520" y="196" class="mono" font-size="13.5" fill="#e2e8f0"><tspan fill="#22d3ee">$</tspan> visionx count street.mp4</text>
    <text x="520" y="216" class="mono" font-size="13.5" fill="#a78bfa">person in 4  out 0</text>
  </g>
</svg>
